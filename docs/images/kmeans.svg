<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><rect width="900" height="360" fill="#f8fafc"/><text x="30" y="44" font-family="sans-serif" font-size="25" font-weight="bold" fill="#0f172a">K-Means: asignación → actualización de centroides</text><g font-family="sans-serif" font-size="21" fill="#0f172a"><rect x="40" y="90" width="250" height="190" rx="15" fill="#dbeafe"/><text x="62" y="123">1. Asignar al centro</text><circle cx="90" cy="180" r="9" fill="#2563eb"/><circle cx="130" cy="210" r="9" fill="#2563eb"/><circle cx="230" cy="170" r="9" fill="#dc2626"/><circle cx="245" cy="215" r="9" fill="#dc2626"/><rect x="320" y="155" width="120" height="45" rx="10" fill="#cbd5e1"/><text x="338" y="184">repetir →</text><rect x="470" y="90" width="380" height="190" rx="15" fill="#dcfce7"/><text x="490" y="123">2. Recalcular medias</text><text x="500" y="185">μ₁ = media del grupo azul</text><text x="500" y="224">μ₂ = media del grupo rojo</text></g></svg>