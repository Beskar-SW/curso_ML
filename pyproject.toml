[project]
name = "curso-ml"
version = "0.2.0"
description = "Curso práctico de Machine Learning con algoritmos educativos NumPy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "seaborn>=0.12"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
